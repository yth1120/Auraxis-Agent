appId: com.auraxis.app
productName: Auraxis
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  # 源码映射只服务本地调试：不打包进安装包，避免体积膨胀与源码外泄。
  - '!dist-electron/**/*.map'
  # 依赖自带的 source map 同样只在调试时有用（占原 asar 数百 MB 量级）。
  - '!node_modules/**/*.map'
  - package.json
asar: true
# node-pty 1.x 使用 N-API 并随包附带各平台预编译产物，无需 node-gyp 重编译；
# better-sqlite3 为可选原生依赖（未安装时自动回退 JSON）。跳过 rebuild 可让
# 无本地 C++ 工具链的环境直接完成打包。
npmRebuild: false
asarUnpack:
  - 'node_modules/better-sqlite3/**'
  - 'node_modules/node-pty/**'
extraResources:
  - from: electron/sandbox-windows.ps1
    to: sandbox/sandbox-windows.ps1
  - from: electron/sandbox-appcontainer.ps1
    to: sandbox/sandbox-appcontainer.ps1
  - from: electron/sandbox-linux.sh
    to: sandbox/sandbox-linux.sh
  - from: electron/sandbox-macos.sh
    to: sandbox/sandbox-macos.sh
  - from: scripts/auraxis-mcp-preload.cjs
    to: mcp/auraxis-mcp-preload.cjs
  - from: electron/tokenizer/tokenizer.json
    to: tokenizer/tokenizer.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  # 公证前置条件：hardened runtime + 显式 entitlements。公证本身由 CI 按
  # APPLE_* secrets 是否存在决定（见 .github/workflows/build.yml），
  # 未配置凭据时仍产出可运行的未签名 dmg。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - AppImage
  icon: build/icon.png
extraMetadata:
  main: dist-electron/main.js

# electron-updater 的更新源：与仓库 Release 资产一致；CI 用 --publish never，
# 这里只负责生成 app-update.yml 与 latest*.yml。
publish:
  provider: github
  owner: yth1120
  repo: Auraxis-Agent
