[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auraxis-sdk"
version = "3.3.0"
description = "Python client SDK for driving an Auraxis runtime over JSON-RPC 2.0 (loopback TCP)"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["auraxis_sdk*"]
