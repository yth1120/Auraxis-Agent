name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run electron:compile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run sdk:build
      - run: npx vite build
      # Coverage currently remains below the configured thresholds; keep the
      # full unit suite blocking while coverage is tracked separately in
      # Settings → Coverage instead of blocking platform releases.
      - run: npm run test
      - run: npm run sdk:test:py
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run check:docs
      - run: npm run lint

      - name: Run E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run E2E (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Auraxis-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Auraxis-*
          path: release
          merge-multiple: true

      - name: Prepare release notes
        run: |
          HEADER="## ${GITHUB_REF_NAME} ("
          awk -v h="$HEADER" 'BEGIN{found=0} index($0,h){found=1} found && $0 ~ /^## / && index($0,h)==0{exit} found{print}' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Auraxis ${{ github.ref_name }}
          files: release/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
