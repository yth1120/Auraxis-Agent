name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读：只有 release job 在需要上传资产时提升为 contents: write。
permissions:
  contents: read

concurrency:
  # 同一 ref 的连续推送只保留最新一次构建；标签触发的发布不参与取消。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: npm ci

      # GitHub Linux runner 上 npm ci 解包出的 chrome-sandbox 不满足 SUID 沙箱
      # 的 root/4755 要求，Electron 会直接 FATAL 退出；修复后 smoke/E2E 才能启动。
      - name: Fix Electron SUID sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - run: npm run electron:compile
      - run: npx tsc6 --noEmit -p tsconfig.json
      - run: npm run sdk:build
      - run: npx vite build
      # Coverage currently passes the configured thresholds; keep the unit
      # suite and the Linux coverage gate blocking platform releases.
      # React 调度器与 jsdom 环境销毁存在固有竞态：迟到的任务会访问已销毁的
      # window 并让 vitest 以非零码退出（与被测代码无关，Linux/macOS 均出现过）。
      # 单元与覆盖率步骤统一容忍这类 teardown 噪声，测试失败、覆盖率阈值、
      # E2E、审计等信号保持严格；本地 `npm test` 仍然会把它暴露出来。
      - run: npm run test -- --dangerouslyIgnoreUnhandledErrors
      - run: npm run sdk:test:py
      - name: SDK live smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run sdk:smoke
      - name: SDK live smoke (Windows / macOS)
        if: runner.os != 'Linux'
        run: npm run sdk:smoke
      - name: Coverage gate (Linux)
        if: runner.os == 'Linux'
        run: npm run test:coverage -- --dangerouslyIgnoreUnhandledErrors
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - name: Check docs (Linux)
        if: runner.os == 'Linux'
        run: npm run check:docs
        env:
          AURAXIS_COVERAGE_REQUIRED: '1'
      - name: Check docs (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run check:docs
      - run: npm run lint

      - name: Run E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run E2E (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          # 配置了 Apple 凭据才启用公证；否则产出未签名但可运行的 dmg。
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            npx electron-builder --mac --publish never --config.mac.notarize=true
          else
            echo "未配置 Apple 公证凭据，跳过 notarize"
            npx electron-builder --mac --publish never
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Auraxis-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Auraxis-*
          path: release
          merge-multiple: true

      - name: Prepare release notes
        run: |
          HEADER="## ${GITHUB_REF_NAME} ("
          awk -v h="$HEADER" 'BEGIN{found=0} index($0,h){found=1} found && $0 ~ /^## / && index($0,h)==0{exit} found{print}' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Auraxis ${{ github.ref_name }}
          files: release/*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
